[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flashvsr-mlx"
version = "0.1.0"
description = "MLX port of FlashVSR v1.1 (Tiny) video super-resolution for Apple Silicon"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
authors = [{ name = "Hermes Reisner" }]
requires-python = ">=3.10"
# Tested with mlx 0.32.4, numpy 2.5.5, safetensors 0.8.0, torch 2.15.0, imageio 2.38.2,
# imageio-ffmpeg 0.8.1, pillow 13.0.0. torch is only used to read the two .ckpt weight files.
dependencies = [
    "mlx>=0.32",
    "numpy",
    "safetensors",
    "torch",
    "imageio",
    "imageio-ffmpeg",
    "pillow",
]

[project.optional-dependencies]
# The parity tests run the upstream PyTorch code (git submodule third_party/FlashVSR) as the reference.
test = ["pytest", "einops"]

[project.scripts]
flashvsr-mlx = "mlx_flashvsr.cli:main"

[project.urls]
Upstream = "https://github.com/OpenImagingLab/FlashVSR"

[tool.setuptools]
packages = ["mlx_flashvsr"]

[tool.setuptools.package-data]
mlx_flashvsr = ["assets/posi_prompt.pth"]
